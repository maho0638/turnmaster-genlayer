name: Verify TurnMaster

on:
  push:
    branches:
      - main
      - "audit/**"
      - "fix/**"
      - "upgrade/**"
      - "ui/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: turnmaster-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:network
      - run: npm run test:project-proof
      - run: npm run test:real-board
      - run: npm run test:registry
      - run: npm run test:contract-proof
      - run: npm run test:live-rpc
      - run: npm run test:deploy-preflight
      - run: npm run build:vercel
      - name: Smoke-test built Next.js site
        shell: bash
        run: |
          set -euo pipefail
          npx next start -H 127.0.0.1 -p 3000 >/tmp/turnmaster-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/turnmaster-home.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/turnmaster-next.log
            exit 1
          fi

          grep -qi "turnmaster" /tmp/turnmaster-home.html
          curl -fsS http://127.0.0.1:3000/reviewer >/tmp/turnmaster-reviewer.html
          grep -qi "reviewer proof" /tmp/turnmaster-reviewer.html
          curl -fsS http://127.0.0.1:3000/project-proof.json >/tmp/project-proof.json
          node -e 'const p=require("/tmp/project-proof.json"); if(p.verifiedDeployment?.status!=="FINALIZED") process.exit(1)'
          curl -fsS http://127.0.0.1:3000/TurnMasterEscrow.py >/tmp/TurnMasterEscrow.py
          cmp contracts/TurnMasterEscrow.py /tmp/TurnMasterEscrow.py

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: genvm-lint check contracts/TurnMasterEscrow.py
      - run: HOME=/tmp/turnmaster-gltest-home python -m pytest tests/test_contract_direct.py -q
